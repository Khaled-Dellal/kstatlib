[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kstatlib"  # Must be unique on PyPI
version = "0.1.0"
authors = [
    {name = "Khaled DELLAL", email = "dellal.khaled.enssea@gmail.com"},
]
description = "Statistics and modeling tools"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Khaled-Dellal/kstatlib"
Repository = "https://github.com/Khaled-Dellal/kstatlib.git"
